name: Windows desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-desktop-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/desktop/requirements-build.txt
      - name: Install desktop build dependencies
        run: python -m pip install -r apps/desktop/requirements-build.txt
      - name: Build and verify the executable
        run: python apps/desktop/build_release.py
      - name: Preserve build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-reports
          path: build/desktop-*/verification/
          if-no-files-found: ignore
      - name: Publish tested release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseInfo = Get-Content dist/release.json -Raw | ConvertFrom-Json
          gh release create $releaseInfo.tag $releaseInfo.archive $releaseInfo.checksums --target $env:GITHUB_SHA --title $releaseInfo.title --notes-file apps/desktop/RELEASE_NOTES.md